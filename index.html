<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vendas - Visão Geral</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Nosso CSS personalizado -->
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar será implementada depois -->
        <div class="w-64 bg-blue-800 text-white p-4" id="sidebar">
            <!-- Conteúdo será carregado via JS -->
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto p-8">
            <header class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Visão Geral de Vendas</h1>
                <div class="flex items-center mt-2">
                    <span class="bg-blue-100 text-blue-800 text-sm font-medium px-2.5 py-0.5 rounded" id="update-date">Carregando dados...</span>
                </div>
            </header>

            <!-- Cards de Resumo -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="summary-cards">
                <!-- Serão preenchidos via JS -->
            </div>

            <!-- Gráficos -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold mb-4">Vendas Mensais (2025)</h3>
                    <div class="h-64">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold mb-4">Top Departamentos por Lucro</h3>
                    <div class="h-64">
                        <canvas id="departmentsChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Tabela de Produtos -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="p-6 border-b">
                    <h3 class="text-lg font-semibold">Produtos Mais Vendidos</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200" id="products-table">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Produto</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Departamento</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantidade</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Venda Líquida</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lucro</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="products-table-body">
                            <!-- Será preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Nosso JavaScript -->
    <script src="/scripts/main.js"></script>
</body>
</html>
